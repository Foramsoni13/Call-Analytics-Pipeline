<header class="topbar">
  <div class="topbar__brand">
    <div class="mini-waveform"><span></span><span></span><span></span><span></span><span></span></div>
    <span class="auth-card__brand-text">Call<span class="accent">Sense</span></span>
    <span class="admin-badge">Admin</span>
  </div>
  <div class="topbar__user">
    <span>Hi, <strong>{{ session.get('username') }}</strong></span>
    <a href="{{ url_for('dashboard') }}" class="btn btn--ghost btn--small">Back to app</a>
    <a href="{{ url_for('logout') }}" class="btn btn--ghost btn--small">Logout</a>
  </div>
</header>

<nav class="admin-tabs">
  <a href="{{ url_for('admin_overview') }}" class="admin-tab{% if active_tab == 'overview' %} admin-tab--active{% endif %}">Overview</a>
  <a href="{{ url_for('admin_users') }}" class="admin-tab{% if active_tab == 'users' %} admin-tab--active{% endif %}">Users</a>
  <a href="{{ url_for('admin_calls') }}" class="admin-tab{% if active_tab == 'calls' %} admin-tab--active{% endif %}">Calls</a>
</nav>

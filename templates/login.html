{% extends "base.html" %}
{% block title %}Login — CallSense{% endblock %}
{% block content %}
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-card__brand">
      <div class="mini-waveform"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="auth-card__brand-text">Call<span class="accent">Sense</span></span>
    </div>

    <h1 class="auth-card__title">Welcome back</h1>
    <p class="auth-card__subtitle">Login to view your call analytics dashboard.</p>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="loginForm" novalidate>
      <div class="field">
        <label for="loginIdentifier" class="field__label">Username or Email</label>
        <input type="text" id="loginIdentifier" name="identifier" value="{{ identifier or '' }}" required autofocus autocomplete="username">
        <span class="field__error" id="identifierError"></span>
      </div>

      <div class="field">
        <label for="loginPassword" class="field__label">Password</label>
        <div class="field__input-wrap">
          <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
          <button type="button" class="field__toggle-pw" id="toggleLoginPwBtn" title="Toggle password visibility" aria-label="Show password">
            <svg class="eye-icon eye-icon--open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-icon eye-icon--closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="field__subtext-row">
          <a href="{{ url_for('forgot_password') }}" class="field__forgot-link" id="forgotPasswordLink">Forgot Password?</a>
        </div>
        <span class="field__error" id="passwordError"></span>
      </div>

      <button type="submit" class="btn btn--primary btn--block" id="loginSubmitBtn">Log in</button>
    </form>

    <p class="auth-card__footer">
      New here? <a href="{{ url_for('register') }}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var form = document.getElementById('loginForm');
  var identifierInput = document.getElementById('loginIdentifier');
  var passwordInput = document.getElementById('loginPassword');
  var identifierError = document.getElementById('identifierError');
  var passwordError = document.getElementById('passwordError');
  var toggleBtn = document.getElementById('toggleLoginPwBtn');

  // Toggle password visibility with professional icons
  var openIcon = toggleBtn.querySelector('.eye-icon--open');
  var closedIcon = toggleBtn.querySelector('.eye-icon--closed');
  toggleBtn.addEventListener('click', function() {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      if (openIcon) openIcon.style.display = 'none';
      if (closedIcon) closedIcon.style.display = 'block';
      toggleBtn.setAttribute('aria-label', 'Hide password');
    } else {
      passwordInput.type = 'password';
      if (openIcon) openIcon.style.display = 'block';
      if (closedIcon) closedIcon.style.display = 'none';
      toggleBtn.setAttribute('aria-label', 'Show password');
    }
  });

  function setError(input, errorEl, msg) {
    if (msg) {
      input.classList.add('is-invalid');
      input.classList.remove('is-valid');
      errorEl.textContent = msg;
      errorEl.classList.add('is-visible');
    } else {
      input.classList.remove('is-invalid');
      input.classList.add('is-valid');
      errorEl.textContent = '';
      errorEl.classList.remove('is-visible');
    }
  }

  function validateIdentifier(showClean) {
    var val = identifierInput.value.trim();
    if (!val) {
      if (showClean) setError(identifierInput, identifierError, 'Please enter your username or email address.');
      return false;
    }
    setError(identifierInput, identifierError, '');
    return true;
  }

  function validatePassword(showClean) {
    var val = passwordInput.value;
    if (!val) {
      if (showClean) setError(passwordInput, passwordError, 'Please enter your password.');
      return false;
    }
    setError(passwordInput, passwordError, '');
    return true;
  }

  identifierInput.addEventListener('input', function() { validateIdentifier(false); });
  identifierInput.addEventListener('blur', function() { validateIdentifier(true); });

  passwordInput.addEventListener('input', function() { validatePassword(false); });
  passwordInput.addEventListener('blur', function() { validatePassword(true); });

  form.addEventListener('submit', function(e) {
    var idValid = validateIdentifier(true);
    var pwValid = validatePassword(true);

    if (!idValid || !pwValid) {
      e.preventDefault();
      if (!idValid) identifierInput.focus();
      else passwordInput.focus();
    }
  });
})();
</script>
{% endblock %}

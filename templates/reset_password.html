{% extends "base.html" %}
{% block title %}Set New Password — CallSense{% endblock %}
{% block content %}
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-card__brand">
      <div class="mini-waveform"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="auth-card__brand-text">Call<span class="accent">Sense</span></span>
    </div>

    <h1 class="auth-card__title">Create new password</h1>
    <p class="auth-card__subtitle">Your identity has been verified. Choose a strong new password for your account.</p>

    <form method="POST" action="{{ url_for('reset_password') }}" class="auth-form" id="resetPasswordForm" novalidate>
      <input type="hidden" name="token" value="{{ token }}">

      <div class="field">
        <label for="newPassword" class="field__label">New Password</label>
        <div class="field__input-wrap">
          <input type="password" id="newPassword" name="password" required autofocus autocomplete="new-password" placeholder="At least 8 characters">
          <button type="button" class="field__toggle-pw" id="toggleNewPwBtn" title="Toggle password visibility" aria-label="Show password">
            <svg class="eye-icon eye-icon--open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-icon eye-icon--closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="pw-strength-bar" id="pwStrengthBar" style="display: none;">
          <span class="pw-strength-segment" id="pwSeg1"></span>
          <span class="pw-strength-segment" id="pwSeg2"></span>
          <span class="pw-strength-segment" id="pwSeg3"></span>
        </div>
        <span class="pw-strength-text" id="pwStrengthText" style="display: none;"></span>
        <span class="field__error" id="newPasswordError"></span>
      </div>

      <div class="field">
        <label for="confirmPassword" class="field__label">Confirm New Password</label>
        <div class="field__input-wrap">
          <input type="password" id="confirmPassword" name="confirm_password" required autocomplete="new-password" placeholder="Re-enter new password">
          <button type="button" class="field__toggle-pw" id="toggleConfirmPwBtn" title="Toggle password visibility" aria-label="Show password">
            <svg class="eye-icon eye-icon--open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-icon eye-icon--closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <span class="field__error" id="confirmPasswordError"></span>
      </div>

      <button type="submit" class="btn btn--primary btn--block" id="resetSubmitBtn">
        <span class="btn__text">Reset Password</span>
        <span class="btn__spinner" style="display: none;"></span>
      </button>
    </form>

    <p class="auth-card__footer">
      Back to <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var form = document.getElementById('resetPasswordForm');
  var passwordInput = document.getElementById('newPassword');
  var confirmInput = document.getElementById('confirmPassword');
  var passwordError = document.getElementById('newPasswordError');
  var confirmError = document.getElementById('confirmPasswordError');
  var submitBtn = document.getElementById('resetSubmitBtn');
  var btnText = submitBtn.querySelector('.btn__text');
  var btnSpinner = submitBtn.querySelector('.btn__spinner');

  var toggleNewBtn = document.getElementById('toggleNewPwBtn');
  var toggleConfBtn = document.getElementById('toggleConfirmPwBtn');

  var pwStrengthBar = document.getElementById('pwStrengthBar');
  var pwStrengthText = document.getElementById('pwStrengthText');
  var pwSeg1 = document.getElementById('pwSeg1');
  var pwSeg2 = document.getElementById('pwSeg2');
  var pwSeg3 = document.getElementById('pwSeg3');

  function setupToggle(btn, input) {
    var openIcon = btn.querySelector('.eye-icon--open');
    var closedIcon = btn.querySelector('.eye-icon--closed');
    btn.addEventListener('click', function() {
      if (input.type === 'password') {
        input.type = 'text';
        if (openIcon) openIcon.style.display = 'none';
        if (closedIcon) closedIcon.style.display = 'block';
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        if (openIcon) openIcon.style.display = 'block';
        if (closedIcon) closedIcon.style.display = 'none';
        btn.setAttribute('aria-label', 'Show password');
      }
    });
  }
  setupToggle(toggleNewBtn, passwordInput);
  setupToggle(toggleConfBtn, confirmInput);

  function checkStrength(pw) {
    if (!pw) return 0;
    var score = 0;
    if (pw.length >= 8) score++;
    if (/[a-zA-Z]/.test(pw) && /[0-9]/.test(pw)) score++;
    if (/[^a-zA-Z0-9]/.test(pw) || pw.length >= 12) score++;
    return score;
  }

  function renderStrength() {
    var val = passwordInput.value;
    if (!val) {
      pwStrengthBar.style.display = 'none';
      pwStrengthText.style.display = 'none';
      return;
    }
    pwStrengthBar.style.display = 'flex';
    pwStrengthText.style.display = 'block';

    var score = checkStrength(val);
    pwSeg1.className = 'pw-strength-segment';
    pwSeg2.className = 'pw-strength-segment';
    pwSeg3.className = 'pw-strength-segment';

    if (score === 1) {
      pwSeg1.classList.add('is-weak');
      pwStrengthText.textContent = 'Weak (add numbers or make longer)';
      pwStrengthText.style.color = 'var(--negative)';
    } else if (score === 2) {
      pwSeg1.classList.add('is-medium');
      pwSeg2.classList.add('is-medium');
      pwStrengthText.textContent = 'Medium password';
      pwStrengthText.style.color = 'var(--warning)';
    } else if (score >= 3) {
      pwSeg1.classList.add('is-strong');
      pwSeg2.classList.add('is-strong');
      pwSeg3.classList.add('is-strong');
      pwStrengthText.textContent = 'Strong password';
      pwStrengthText.style.color = 'var(--positive)';
    }
  }

  function setError(input, errorEl, msg) {
    if (msg) {
      input.classList.add('is-invalid');
      input.classList.remove('is-valid');
      errorEl.textContent = msg;
      errorEl.classList.add('is-visible');
    } else {
      input.classList.remove('is-invalid');
      input.classList.add('is-valid');
      errorEl.textContent = '';
      errorEl.classList.remove('is-visible');
    }
  }

  function validateNewPassword(showClean) {
    var val = passwordInput.value;
    if (!val) {
      if (showClean) setError(passwordInput, passwordError, 'Please enter a new password.');
      return false;
    }
    if (val.length < 8) {
      if (showClean) setError(passwordInput, passwordError, 'Password must be at least 8 characters long.');
      return false;
    }
    if (!/[A-Za-z]/.test(val) || !/[0-9]/.test(val)) {
      if (showClean) setError(passwordInput, passwordError, 'Password must contain at least one letter and one number.');
      return false;
    }
    setError(passwordInput, passwordError, '');
    return true;
  }

  function validateConfirm(showClean) {
    var pw = passwordInput.value;
    var conf = confirmInput.value;
    if (!conf) {
      if (showClean) setError(confirmInput, confirmError, 'Please confirm your new password.');
      return false;
    }
    if (pw !== conf) {
      if (showClean) setError(confirmInput, confirmError, 'Passwords do not match.');
      return false;
    }
    setError(confirmInput, confirmError, '');
    return true;
  }

  passwordInput.addEventListener('input', function() {
    renderStrength();
    validateNewPassword(false);
    if (confirmInput.value) validateConfirm(false);
  });
  passwordInput.addEventListener('blur', function() { validateNewPassword(true); });

  confirmInput.addEventListener('input', function() { validateConfirm(false); });
  confirmInput.addEventListener('blur', function() { validateConfirm(true); });

  form.addEventListener('submit', function(e) {
    var pValid = validateNewPassword(true);
    var cValid = validateConfirm(true);

    if (!pValid || !cValid) {
      e.preventDefault();
      if (!pValid) passwordInput.focus();
      else confirmInput.focus();
      return;
    }

    submitBtn.disabled = true;
    if (btnText) btnText.textContent = 'Updating password...';
    if (btnSpinner) btnSpinner.style.display = 'inline-block';
  });
})();
</script>
{% endblock %}
